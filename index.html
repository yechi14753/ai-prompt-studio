<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 生圖提示詞庫 | Prompt Studio</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts (Inter & Noto Sans TC) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        /* 自訂捲軸樣式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .prompt-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .prompt-card:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-300">Prompt Studio</h1>
                    <p class="text-[11px] text-slate-400 hidden sm:block">AI 繪圖提示詞庫與組合生成器</p>
                </div>
            </div>

            <!-- 搜尋框 -->
            <div class="flex-1 max-w-md relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="searchInput" placeholder="搜尋英文或中文提示詞..." 
                    class="w-full bg-slate-800/80 border border-slate-700 text-sm rounded-xl pl-10 pr-4 py-2 text-slate-200 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            </div>

            <!-- 右側操作按鈕 -->
            <div class="flex items-center gap-2">
                <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-xl flex items-center gap-1.5 shadow-lg shadow-indigo-600/20 transition cursor-pointer">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">新增提示詞</span>
                </button>
                <button onclick="exportData()" title="匯出備份" class="p-2 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 transition cursor-pointer">
                    <i data-lucide="download" class="w-4 h-4"></i>
                </button>
                <label title="匯入備份" class="p-2 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 transition cursor-pointer">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- 左側與中間：分類與提示詞列表 (佔 8 欄) -->
        <div class="lg:col-span-8 flex flex-col gap-5">
            
            <!-- 分類標籤列 -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2" id="categoryBar">
                <!-- 分類按鈕將由 JS 動態生成 -->
            </div>

            <!-- 提示詞操作提示與狀態 -->
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400 bg-slate-800/40 px-4 py-2.5 rounded-xl border border-slate-800">
                <div class="flex items-center gap-2">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span>點擊卡片<strong class="text-slate-200">直接複製</strong>單一提示詞；勾選右上角核取方塊可<strong class="text-indigo-400">加入右側組合</strong></span>
                </div>
                <span id="promptCount">共 0 個提示詞</span>
            </div>

            <!-- 提示詞卡片網格 -->
            <div id="promptGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                <!-- 提示詞卡片將由 JS 動態生成 -->
            </div>
        </div>

        <!-- 右側：組合生成器 & 已儲存分組 (佔 4 欄) -->
        <div class="lg:col-span-4 flex flex-col gap-6">
            
            <!-- 1. 當前選取組合區 (工作台) -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col gap-4 sticky top-20">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                    <div class="flex items-center gap-2">
                        <i data-lucide="layers" class="w-4 h-4 text-indigo-400"></i>
                        <h2 class="font-semibold text-sm text-slate-100">當前組合工作台</h2>
                        <span id="selectedBadge" class="bg-indigo-500/20 text-indigo-300 text-xs px-2 py-0.5 rounded-full font-medium">0</span>
                    </div>
                    <button onclick="clearSelection()" class="text-xs text-slate-400 hover:text-rose-400 transition cursor-pointer">
                        清空重選
                    </button>
                </div>

                <!-- 已選取的標籤列表 -->
                <div id="selectedTagsContainer" class="min-h-[80px] max-h-[160px] overflow-y-auto flex flex-wrap gap-1.5 p-2.5 bg-slate-950/60 rounded-xl border border-slate-800/80">
                    <p class="text-xs text-slate-500 w-full text-center my-auto">尚未勾選任何提示詞...</p>
                </div>

                <!-- 組合預覽與複製按鈕 -->
                <div class="flex flex-col gap-2">
                    <div class="flex items-center justify-between text-xs text-slate-400">
                        <span>最終輸出預覽 (自動以逗號分隔)</span>
                    </div>
                    <textarea id="combinedPreview" rows="3" readonly placeholder="勾選提示詞後將在此產生組合字串..."
                        class="w-full bg-slate-800/60 border border-slate-700/80 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none resize-none"></textarea>
                    
                    <div class="grid grid-cols-2 gap-2 mt-1">
                        <button onclick="copyCombinedPrompts()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium py-2.5 px-3 rounded-xl flex items-center justify-center gap-1.5 shadow-lg shadow-emerald-600/20 transition cursor-pointer">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            <span>一鍵複製組合</span>
                        </button>
                        <button onclick="openSaveGroupModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium py-2.5 px-3 rounded-xl flex items-center justify-center gap-1.5 transition cursor-pointer">
                            <i data-lucide="bookmark-plus" class="w-3.5 h-3.5 text-indigo-400"></i>
                            <span>存為常用分組</span>
                        </button>
                    </div>
                </div>

                <!-- 2. 已儲存的常用分組 (Presets) -->
                <div class="border-t border-slate-800 pt-4 flex flex-col gap-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <i data-lucide="folder-heart" class="w-4 h-4 text-purple-400"></i>
                            <h3 class="font-semibold text-sm text-slate-100">已儲存的常用分組</h3>
                        </div>
                        <span id="groupCount" class="text-xs text-slate-500">0 組</span>
                    </div>

                    <div id="savedGroupsList" class="flex flex-col gap-2.5 max-h-[320px] overflow-y-auto pr-1">
                        <!-- 分組卡片將由 JS 動態生成 -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- 彈窗 1：新增 / 編輯提示詞 -->
    <div id="promptModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl transform transition-all">
            <div class="flex items-center justify-between mb-4">
                <h3 id="promptModalTitle" class="text-lg font-bold text-white">新增提示詞</h3>
                <button onclick="closeModal('promptModal')" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="promptForm" onsubmit="savePrompt(event)" class="flex flex-col gap-4">
                <input type="hidden" id="editPromptId">
                
                <!-- 選擇分類 -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">所屬分類</label>
                    <select id="promptCategorySelect" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <!-- 動態填入分類 -->
                    </select>
                </div>

                <!-- 英文提示詞 -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-medium text-slate-300">英文提示詞 (English Prompt) *</label>
                        <button type="button" id="autoTranslateBtn" onclick="autoTranslatePrompt()" class="text-xs bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-lg flex items-center gap-1 transition cursor-pointer">
                            <i data-lucide="languages" class="w-3.5 h-3.5"></i>
                            <span>AI 自動翻成中文</span>
                        </button>
                    </div>
                    <input type="text" id="promptEnInput" required placeholder="例如：masterpiece, best quality, cyberpunk city"
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- 中文對照 -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">中文解釋 / 備註 (可自動翻譯或手動輸入)</label>
                    <input type="text" id="promptZhInput" placeholder="例如：傑作, 最高畫質, 賽博龐克城市"
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex justify-end gap-2 mt-2">
                    <button type="button" onclick="closeModal('promptModal')" class="px-4 py-2 rounded-xl text-sm text-slate-300 hover:bg-slate-800 transition">取消</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/20 transition">儲存提示詞</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 彈窗 2：新增分類 -->
    <div id="categoryModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-white">新增分類</h3>
                <button onclick="closeModal('categoryModal')" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form onsubmit="addCategory(event)" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">分類名稱</label>
                    <input type="text" id="newCategoryName" required placeholder="例如：光影效果、服裝、鏡頭視角..."
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeModal('categoryModal')" class="px-4 py-2 rounded-xl text-sm text-slate-300 hover:bg-slate-800">取消</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white">建立分類</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 彈窗 3：儲存為常用分組 -->
    <div id="groupModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-white">儲存為常用分組</h3>
                <button onclick="closeModal('groupModal')" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form onsubmit="saveGroup(event)" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">分組名稱</label>
                    <input type="text" id="newGroupName" required placeholder="例如：二次元厚塗起手式、寫實人像打光..."
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/80">
                    <p class="text-[11px] text-slate-400 mb-1">包含以下提示詞：</p>
                    <p id="groupModalPreview" class="text-xs text-indigo-300 line-clamp-3"></p>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeModal('groupModal')" class="px-4 py-2 rounded-xl text-sm text-slate-300 hover:bg-slate-800">取消</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white">儲存分組</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 全域 Toast 提示訊息框 (取代 alert) -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // ==========================================
        // 1. 狀態與預設資料管理
        // ==========================================
        const STORAGE_KEY = 'ai_prompt_studio_data_v1';

        const defaultData = {
            categories: [
                { id: 'cat_quality', name: '畫質起手式' },
                { id: 'cat_style', name: '藝術風格' },
                { id: 'cat_lighting', name: '光影氛圍' },
                { id: 'cat_camera', name: '鏡頭視角' },
                { id: 'cat_character', name: '人物特徵' }
            ],
            prompts: [
                { id: 'p_1', categoryId: 'cat_quality', en: 'masterpiece', zh: '傑作' },
                { id: 'p_2', categoryId: 'cat_quality', en: 'best quality', zh: '最高畫質' },
                { id: 'p_3', categoryId: 'cat_quality', en: 'ultra-detailed', zh: '極致細節' },
                { id: 'p_4', categoryId: 'cat_quality', en: '8k resolution', zh: '8K 解析度' },
                { id: 'p_5', categoryId: 'cat_style', en: 'cyberpunk aesthetic', zh: '賽博龐克美學' },
                { id: 'p_6', categoryId: 'cat_style', en: 'anime key visual', zh: '動漫主視覺圖' },
                { id: 'p_7', categoryId: 'cat_style', en: 'photorealistic', zh: '照片級寫實' },
                { id: 'p_8', categoryId: 'cat_lighting', en: 'cinematic lighting', zh: '電影級打光' },
                { id: 'p_9', categoryId: 'cat_lighting', en: 'volumetric fog', zh: '體積霧 / 丁達爾效應' },
                { id: 'p_10', categoryId: 'cat_lighting', en: 'golden hour', zh: '黃金時刻暖光' },
                { id: 'p_11', categoryId: 'cat_camera', en: 'depth of field', zh: '景深效果 (背景模糊)' },
                { id: 'p_12', categoryId: 'cat_camera', en: 'dynamic angle', zh: '動態廣角視角' },
                { id: 'p_13', categoryId: 'cat_character', en: '1girl, solo', zh: '單人女性角色' },
                { id: 'p_14', categoryId: 'cat_character', en: 'detailed eyes', zh: '精緻眼神細節' }
            ],
            groups: [
                {
                    id: 'g_1',
                    name: '通用高畫質起手式',
                    promptIds: ['p_1', 'p_2', 'p_3', 'p_4']
                },
                {
                    id: 'g_2',
                    name: '電影感賽博龐克',
                    promptIds: ['p_1', 'p_2', 'p_5', 'p_8', 'p_9']
                }
            ]
        };

        let appData = loadData();
        let activeCategoryId = 'ALL'; // 'ALL' 代表全部分類
        let searchQuery = '';
        let selectedPromptIds = []; // 當前勾選要組合成一組的提示詞 ID 陣列 (保留選取順序)

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch (e) {
                console.error('讀取本地資料失敗:', e);
            }
            return JSON.parse(JSON.stringify(defaultData));
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            } catch (e) {
                showToast('儲存資料失敗，可能是瀏覽器空間已滿', 'error');
            }
        }

        // ==========================================
        // 2. Gemini API 自動翻譯功能 (英翻中)
        // ==========================================
        async function autoTranslatePrompt() {
            const enText = document.getElementById('promptEnInput').value.trim();
            if (!enText) {
                showToast('請先輸入英文提示詞！', 'warning');
                return;
            }

            const btn = document.getElementById('autoTranslateBtn');
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i><span>翻譯中...</span>`;
            lucide.createIcons();

            const apiKey = ""; // 執行環境會自動注入 API Key
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{
                    parts: [{ text: `請將以下 AI 繪圖英文提示詞翻譯成簡潔精準的繁體中文（符合台灣 AI 繪圖社群常用術語）。只需要直接輸出翻譯結果，不要包含任何解釋、引號或多餘文字：\n\n${enText}` }]
                }],
                systemInstruction: {
                    parts: [{ text: "你是一個專業的 AI 繪圖（Stable Diffusion / Midjourney）提示詞翻譯專家，專門將英文 Prompt 精準翻譯成簡短的繁體中文對照標籤。" }]
                }
            };

            try {
                const response = await fetchWithRetry(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const translated = result?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
                
                if (translated) {
                    document.getElementById('promptZhInput').value = translated;
                    showToast('AI 翻譯完成！', 'success');
                } else {
                    throw new Error('無有效翻譯回傳');
                }
            } catch (error) {
                showToast('自動翻譯暫時無法使用，請手動輸入中文', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
                lucide.createIcons();
            }
        }

        // 指數退避重試機制
        async function fetchWithRetry(url, options, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const res = await fetch(url, options);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res;
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                    await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
                }
            }
        }

        // ==========================================
        // 3. 畫面渲染邏輯
        // ==========================================
        function renderAll() {
            renderCategories();
            renderPrompts();
            renderWorkbench();
            renderSavedGroups();
            lucide.createIcons();
        }

        // 渲染分類列
        function renderCategories() {
            const bar = document.getElementById('categoryBar');
            let html = `
                <button onclick="selectCategory('ALL')" 
                    class="px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition cursor-pointer flex items-center gap-1.5 ${activeCategoryId === 'ALL' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 border border-slate-700/80'}">
                    <span>全部提示詞</span>
                    <span class="text-[10px] opacity-75 bg-black/20 px-1.5 py-0.2 rounded-full">${appData.prompts.length}</span>
                </button>
            `;

            appData.categories.forEach(cat => {
                const count = appData.prompts.filter(p => p.categoryId === cat.id).length;
                const isActive = activeCategoryId === cat.id;
                html += `
                    <div class="group relative flex items-center">
                        <button onclick="selectCategory('${cat.id}')" 
                            class="px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition cursor-pointer flex items-center gap-1.5 ${isActive ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 border border-slate-700/80'}">
                            <span>${escapeHtml(cat.name)}</span>
                            <span class="text-[10px] opacity-75 bg-black/20 px-1.5 py-0.2 rounded-full">${count}</span>
                        </button>
                        ${appData.categories.length > 1 ? `
                        <button onclick="deleteCategory('${cat.id}', event)" title="刪除分類" 
                            class="hidden group-hover:flex items-center justify-center w-4 h-4 rounded-full bg-rose-500 text-white text-[10px] -ml-2 -mt-4 z-10 hover:bg-rose-600 cursor-pointer">
                            ×
                        </button>` : ''}
                    </div>
                `;
            });

            // 新增分類按鈕
            html += `
                <button onclick="openCategoryModal()" 
                    class="px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap bg-slate-900 hover:bg-slate-800 text-indigo-400 border border-dashed border-indigo-500/40 flex items-center gap-1 transition cursor-pointer">
                    <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i>
                    <span>新增分類</span>
                </button>
            `;

            bar.innerHTML = html;
        }

        // 渲染提示詞卡片網格
        function renderPrompts() {
            const grid = document.getElementById('promptGrid');
            const filtered = appData.prompts.filter(p => {
                const matchCat = activeCategoryId === 'ALL' || p.categoryId === activeCategoryId;
                const q = searchQuery.toLowerCase();
                const matchSearch = !q || p.en.toLowerCase().includes(q) || (p.zh && p.zh.toLowerCase().includes(q));
                return matchCat && matchSearch;
            });

            document.getElementById('promptCount').textContent = `顯示 ${filtered.length} 個提示詞`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 text-center bg-slate-900/50 rounded-2xl border border-dashed border-slate-800">
                        <i data-lucide="inbox" class="w-10 h-10 text-slate-600 mx-auto mb-2"></i>
                        <p class="text-sm text-slate-400">找不到符合的提示詞</p>
                        <button onclick="openAddModal()" class="mt-3 text-xs text-indigo-400 hover:text-indigo-300 underline cursor-pointer">立即新增一個提示詞</button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const isSelected = selectedPromptIds.includes(p.id);
                const cat = appData.categories.find(c => c.id === p.categoryId);
                const catName = cat ? cat.name : '未分類';

                return `
                    <div onclick="copySinglePrompt('${p.id}')" 
                        class="prompt-card group relative bg-slate-900 hover:bg-slate-800/90 border ${isSelected ? 'border-indigo-500 ring-1 ring-indigo-500/50 bg-indigo-950/20' : 'border-slate-800 hover:border-slate-700'} rounded-2xl p-3.5 cursor-pointer flex flex-col justify-between gap-2.5 shadow-sm">
                        
                        <!-- 頂部：分類標籤與勾選框 -->
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-[10px] font-medium px-2 py-0.5 rounded-md bg-slate-800 text-slate-400 border border-slate-700/50 truncate max-w-[110px]">
                                ${escapeHtml(catName)}
                            </span>
                            
                            <div class="flex items-center gap-1" onclick="event.stopPropagation()">
                                <!-- 編輯按鈕 -->
                                <button onclick="openEditModal('${p.id}')" title="編輯" class="opacity-0 group-hover:opacity-100 p-1 text-slate-400 hover:text-indigo-400 rounded-lg transition cursor-pointer">
                                    <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                                </button>
                                <!-- 刪除按鈕 -->
                                <button onclick="deletePrompt('${p.id}')" title="刪除" class="opacity-0 group-hover:opacity-100 p-1 text-slate-400 hover:text-rose-400 rounded-lg transition cursor-pointer">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                                <!-- 加入組合核取方塊 -->
                                <label class="flex items-center justify-center p-1 cursor-pointer" title="勾選加入組合">
                                    <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelectPrompt('${p.id}')" 
                                        class="w-4 h-4 rounded border-slate-600 text-indigo-600 focus:ring-indigo-500 bg-slate-800 cursor-pointer">
                                </label>
                            </div>
                        </div>

                        <!-- 中間：英文與中文對照 -->
                        <div>
                            <div class="font-semibold text-sm text-slate-100 break-words leading-snug group-hover:text-indigo-300 transition">
                                ${escapeHtml(p.en)}
                            </div>
                            <div class="text-xs text-slate-400 mt-1 line-clamp-1">
                                ${p.zh ? escapeHtml(p.zh) : '<span class="italic text-slate-600">無中文對照</span>'}
                            </div>
                        </div>

                        <!-- 底部點擊複製提示 -->
                        <div class="flex items-center justify-end text-[10px] text-slate-500 group-hover:text-emerald-400 transition">
                            <span class="flex items-center gap-1">
                                <i data-lucide="copy" class="w-3 h-3"></i> 點擊複製
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 渲染右側組合工作台
        function renderWorkbench() {
            const container = document.getElementById('selectedTagsContainer');
            const preview = document.getElementById('combinedPreview');
            const badge = document.getElementById('selectedBadge');

            // 過濾掉可能已被刪除的提示詞 ID
            selectedPromptIds = selectedPromptIds.filter(id => appData.prompts.some(p => p.id === id));
            badge.textContent = selectedPromptIds.length;

            if (selectedPromptIds.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 w-full text-center my-auto">點擊提示詞卡片右上角的核取方塊，即可在此組合成串...</p>`;
                preview.value = '';
                return;
            }

            const selectedObjects = selectedPromptIds.map(id => appData.prompts.find(p => p.id === id));

            container.innerHTML = selectedObjects.map(p => `
                <span class="inline-flex items-center gap-1.5 bg-indigo-500/20 border border-indigo-500/40 text-indigo-200 text-xs px-2.5 py-1 rounded-lg">
                    <span class="max-w-[140px] truncate" title="${escapeHtml(p.en)}">${escapeHtml(p.en)}</span>
                    <button onclick="toggleSelectPrompt('${p.id}')" class="hover:text-rose-400 transition cursor-pointer">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>
            `).join('');

            // 組合最終字串
            preview.value = selectedObjects.map(p => p.en).join(', ');
        }

        // 渲染已儲存的常用分組
        function renderSavedGroups() {
            const list = document.getElementById('savedGroupsList');
            document.getElementById('groupCount').textContent = `${appData.groups.length} 組`;

            if (appData.groups.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">尚無已儲存的分組</p>`;
                return;
            }

            list.innerHTML = appData.groups.map(g => {
                // 取得該分組內有效的提示詞文字
                const validPrompts = g.promptIds
                    .map(id => appData.prompts.find(p => p.id === id))
                    .filter(Boolean);
                const combinedText = validPrompts.map(p => p.en).join(', ');

                return `
                    <div class="bg-slate-800/60 hover:bg-slate-800 border border-slate-700/80 rounded-xl p-3 flex flex-col gap-2 transition">
                        <div class="flex items-center justify-between gap-2">
                            <span class="font-medium text-xs text-slate-200 truncate">${escapeHtml(g.name)}</span>
                            <span class="text-[10px] text-slate-400 bg-slate-900 px-2 py-0.5 rounded-full shrink-0">${validPrompts.length} 詞</span>
                        </div>
                        <p class="text-[11px] text-slate-400 line-clamp-2 bg-slate-950/50 p-2 rounded-lg border border-slate-800/80">
                            ${escapeHtml(combinedText || '(此分組內的提示詞已被刪除)')}
                        </p>
                        <div class="flex items-center justify-between gap-2 pt-1">
                            <button onclick="loadGroupToWorkbench('${g.id}')" class="text-[11px] text-indigo-400 hover:text-indigo-300 flex items-center gap-1 cursor-pointer">
                                <i data-lucide="arrow-up-left" class="w-3 h-3"></i> 載入編輯
                            </button>
                            <div class="flex items-center gap-1.5">
                                <button onclick="deleteGroup('${g.id}')" title="刪除分組" class="p-1.5 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-700/50 transition cursor-pointer">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                                <button onclick="copyGroupText('${g.id}')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-medium px-3 py-1.5 rounded-lg flex items-center gap-1 shadow transition cursor-pointer">
                                    <i data-lucide="copy" class="w-3 h-3"></i> 一鍵複製
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // 4. 互動與操作功能
        // ==========================================
        function selectCategory(catId) {
            activeCategoryId = catId;
            renderCategories();
            renderPrompts();
            lucide.createIcons();
        }

        // 單擊複製單一提示詞
        function copySinglePrompt(promptId) {
            const p = appData.prompts.find(item => item.id === promptId);
            if (!p) return;
            copyToClipboard(p.en, `已複製：${p.en}`);
        }

        // 勾選 / 取消勾選提示詞
        function toggleSelectPrompt(promptId) {
            const idx = selectedPromptIds.indexOf(promptId);
            if (idx > -1) {
                selectedPromptIds.splice(idx, 1);
            } else {
                selectedPromptIds.push(promptId);
            }
            renderPrompts();
            renderWorkbench();
            lucide.createIcons();
        }

        function clearSelection() {
            selectedPromptIds = [];
            renderPrompts();
            renderWorkbench();
            lucide.createIcons();
        }

        // 複製工作台組合
        function copyCombinedPrompts() {
            const text = document.getElementById('combinedPreview').value.trim();
            if (!text) {
                showToast('請先勾選至少一個提示詞！', 'warning');
                return;
            }
            copyToClipboard(text, '已複製組合提示詞到剪貼簿！');
        }

        // 複製已儲存分組
        function copyGroupText(groupId) {
            const g = appData.groups.find(item => item.id === groupId);
            if (!g) return;
            const text = g.promptIds
                .map(id => appData.prompts.find(p => p.id === id))
                .filter(Boolean)
                .map(p => p.en)
                .join(', ');
            if (!text) {
                showToast('此分組內沒有可用的提示詞', 'warning');
                return;
            }
            copyToClipboard(text, `已複製分組「${g.name}」！`);
        }

        // 將已儲存分組載入工作台
        function loadGroupToWorkbench(groupId) {
            const g = appData.groups.find(item => item.id === groupId);
            if (!g) return;
            selectedPromptIds = [...g.promptIds];
            renderPrompts();
            renderWorkbench();
            lucide.createIcons();
            showToast(`已將「${g.name}」載入工作台`, 'info');
        }

        // 刪除分組
        function deleteGroup(groupId) {
            appData.groups = appData.groups.filter(g => g.id !== groupId);
            saveData();
            renderSavedGroups();
            lucide.createIcons();
            showToast('已刪除該常用分組', 'info');
        }

        // ==========================================
        // 5. 彈窗與表單處理 (新增/編輯/刪除)
        // ==========================================
        function openAddModal() {
            document.getElementById('promptModalTitle').textContent = '新增提示詞';
            document.getElementById('editPromptId').value = '';
            document.getElementById('promptEnInput').value = '';
            document.getElementById('promptZhInput').value = '';
            populateCategorySelect(activeCategoryId !== 'ALL' ? activeCategoryId : appData.categories[0]?.id);
            showModal('promptModal');
            setTimeout(() => document.getElementById('promptEnInput').focus(), 100);
        }

        function openEditModal(promptId) {
            const p = appData.prompts.find(item => item.id === promptId);
            if (!p) return;
            document.getElementById('promptModalTitle').textContent = '編輯提示詞';
            document.getElementById('editPromptId').value = p.id;
            document.getElementById('promptEnInput').value = p.en;
            document.getElementById('promptZhInput').value = p.zh || '';
            populateCategorySelect(p.categoryId);
            showModal('promptModal');
        }

        function populateCategorySelect(selectedId) {
            const select = document.getElementById('promptCategorySelect');
            select.innerHTML = appData.categories.map(c => 
                `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${escapeHtml(c.name)}</option>`
            ).join('');
        }

        function savePrompt(event) {
            event.preventDefault();
            const id = document.getElementById('editPromptId').value;
            const categoryId = document.getElementById('promptCategorySelect').value;
            const en = document.getElementById('promptEnInput').value.trim();
            const zh = document.getElementById('promptZhInput').value.trim();

            if (!en) return;

            if (id) {
                // 編輯現有
                const idx = appData.prompts.findIndex(p => p.id === id);
                if (idx > -1) {
                    appData.prompts[idx] = { ...appData.prompts[idx], categoryId, en, zh };
                    showToast('提示詞已更新！', 'success');
                }
            } else {
                // 新增
                const newPrompt = {
                    id: 'p_' + Date.now(),
                    categoryId,
                    en,
                    zh
                };
                appData.prompts.unshift(newPrompt);
                showToast('成功新增提示詞！', 'success');
            }

            saveData();
            closeModal('promptModal');
            renderAll();
        }

        function deletePrompt(promptId) {
            appData.prompts = appData.prompts.filter(p => p.id !== promptId);
            selectedPromptIds = selectedPromptIds.filter(id => id !== promptId);
            saveData();
            renderAll();
            showToast('已刪除提示詞', 'info');
        }

        function openCategoryModal() {
            document.getElementById('newCategoryName').value = '';
            showModal('categoryModal');
            setTimeout(() => document.getElementById('newCategoryName').focus(), 100);
        }

        function addCategory(event) {
            event.preventDefault();
            const name = document.getElementById('newCategoryName').value.trim();
            if (!name) return;

            const newCat = {
                id: 'cat_' + Date.now(),
                name
            };
            appData.categories.push(newCat);
            activeCategoryId = newCat.id;
            saveData();
            closeModal('categoryModal');
            renderAll();
            showToast(`已建立分類「${name}」`, 'success');
        }

        function deleteCategory(catId, event) {
            event.stopPropagation();
            if (appData.categories.length <= 1) {
                showToast('至少需要保留一個分類！', 'warning');
                return;
            }
            const fallbackCatId = appData.categories.find(c => c.id !== catId).id;
            // 將該分類下的提示詞轉移到其他分類
            appData.prompts.forEach(p => {
                if (p.categoryId === catId) p.categoryId = fallbackCatId;
            });
            appData.categories = appData.categories.filter(c => c.id !== catId);
            if (activeCategoryId === catId) activeCategoryId = 'ALL';
            saveData();
            renderAll();
            showToast('分類已刪除，原提示詞已自動轉移', 'info');
        }

        function openSaveGroupModal() {
            if (selectedPromptIds.length === 0) {
                showToast('請先勾選至少一個提示詞才能建立分組！', 'warning');
                return;
            }
            document.getElementById('newGroupName').value = '';
            document.getElementById('groupModalPreview').textContent = document.getElementById('combinedPreview').value;
            showModal('groupModal');
            setTimeout(() => document.getElementById('newGroupName').focus(), 100);
        }

        function saveGroup(event) {
            event.preventDefault();
            const name = document.getElementById('newGroupName').value.trim();
            if (!name || selectedPromptIds.length === 0) return;

            appData.groups.unshift({
                id: 'g_' + Date.now(),
                name,
                promptIds: [...selectedPromptIds]
            });

            saveData();
            closeModal('groupModal');
            renderSavedGroups();
            lucide.createIcons();
            showToast(`已儲存常用分組「${name}」！`, 'success');
        }

        // ==========================================
        // 6. 工具函式 (剪貼簿、匯出入、Toast、Modal)
        // ==========================================
        function copyToClipboard(text, successMessage) {
            // 優先使用相容性最高的 execCommand 確保在 iframe 內正常運作
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(successMessage, 'success');
            } catch (err) {
                showToast('複製失敗，請手動選取複製', 'error');
            }
            document.body.removeChild(textarea);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const colors = {
                success: 'bg-emerald-600 text-white border-emerald-500',
                warning: 'bg-amber-600 text-white border-amber-500',
                error: 'bg-rose-600 text-white border-rose-500',
                info: 'bg-slate-800 text-slate-200 border-slate-700'
            };

            const icons = {
                success: 'check-circle-2',
                warning: 'alert-circle',
                error: 'x-circle',
                info: 'info'
            };

            toast.className = `pointer-events-auto flex items-center gap-2 px-4 py-2.5 rounded-xl border shadow-xl text-xs font-medium transform transition-all duration-300 translate-y-2 opacity-0 ${colors[type]}`;
            toast.innerHTML = `<i data-lucide="${icons[type]}" class="w-4 h-4 shrink-0"></i><span>${escapeHtml(message)}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function showModal(id) {
            const el = document.getElementById(id);
            el.classList.remove('hidden');
            el.classList.add('flex');
        }

        function closeModal(id) {
            const el = document.getElementById(id);
            el.classList.add('hidden');
            el.classList.remove('flex');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `ai-prompts-backup-${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('已匯出提示詞庫備份檔！', 'success');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.categories && imported.prompts) {
                        appData = imported;
                        if (!appData.groups) appData.groups = [];
                        saveData();
                        selectedPromptIds = [];
                        activeCategoryId = 'ALL';
                        renderAll();
                        showToast('成功匯入提示詞庫！', 'success');
                    } else {
                        throw new Error('格式不符');
                    }
                } catch (err) {
                    showToast('匯入失敗：檔案格式不正確', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 監聽搜尋輸入
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderPrompts();
            lucide.createIcons();
        });

        // 初始化渲染
        window.onload = () => {
            renderAll();
        };
    </script>
</body>
</html>
